    <!-- Левый -->
    <line x1="70" y1="132" x2="70" y2="102"></line>

    <!-- Левый центральный -->
    <line x1="96" y1="138" x2="96" y2="94"></line>

    <!-- Центральный (максимальная высота) -->
    <line x1="122" y1="144" x2="122" y2="88"></line>

    <!-- Правый центральный (зеркало левого центрального, но немного ниже) -->
    <line x1="148" y1="140" x2="148" y2="100"></line>

    <!-- Правый 1 (понижен, чтобы не заходить под сгиб) -->
    <line x1="174" y1="134" x2="174" y2="110"></line>

    <!-- Правый 2 (ещё ниже — самый короткий) -->
    <line x1="200" y1="130" x2="200" y2="114"></line>
  </g>

  <!-- Текстовые строки -->
  <line x1="62" y1="172" x2="190" y2="172" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"></line>

  <line x1="62" y1="202" x2="164" y2="202" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"></line>
