    M162 26
    V70
    Q162 88 180 88
    H218
  " stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Эквалайзер: вертикально симметричен, но два правых ниже -->
